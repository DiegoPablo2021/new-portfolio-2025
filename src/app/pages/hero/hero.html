<section id="home" class="hero-section" [class.dark]="currentTheme() === 'dark'">
  <div class="hero-container">
    <div class="hero-content">
      <p class="eyebrow">{{ hero().eyebrow }}</p>

      <h1>
        {{ hero().greeting }}<br />
        {{ hero().name }}<span class="accent-dot">.</span>
      </h1>

      <h2 class="role typewriter">
        @if(typedText$ | async; as text) {
        {{ text }}
        } @else {
          &nbsp;
        }
      </h2>

      <p class="intro">{{ hero().intro }}</p>

      <div class="hero-actions">
        <a class="btn-primary" href="/#projects">
          <span [textContent]="currentLanguage() === 'pt' ? 'Explorar projetos' : 'Explore projects'"></span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
        </a>
        <a class="btn-outline" href="assets/Curriculo_Diego_Pablo_Dados_pt-br.pdf" download>
          <span [textContent]="currentLanguage() === 'pt' ? 'Baixar currículo' : 'Download resume'"></span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
        </a>
      </div>

      <p class="skills">{{ hero().skills }}</p>
    </div>

    <div class="hero-img-wrapper">
      <div class="hero-frame">
        <img class="hero-img" src="assets/img/profile.png" alt="Diego Pablo" />
      </div>
    </div>
  </div>
</section>
